[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentreplay"
version = "0.1.0"
description = "The flight recorder for AI agents -- record failures, replay them deterministically, turn each into a regression test."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The AgentReplay Authors" }]
keywords = ["ai", "agents", "llm", "testing", "replay", "regression", "observability", "anthropic", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = ["httpx>=0.23"]

[project.urls]
Homepage = "https://www.agentreplay.space"
Source = "https://github.com/ritankarsaha/AgentReplay"

[project.scripts]
agentreplay = "agentreplay.cli:main"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
langgraph = ["langchain-core>=0.3", "langgraph>=1.2.17"]
controlplane = ["cryptography>=42"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "anthropic>=0.40", "openai>=1.40", "python-dotenv>=1.0", "langchain-core>=0.3", "langgraph>=1.2.17", "cryptography>=42"]

[tool.hatch.build.targets.sdist]
include = ["agentreplay", "LICENSE", "NOTICE", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["agentreplay"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Restrict to the SDK's own tests — ingest/ is a separate subproject with its
# own pyproject.toml/venv (different deps: FastAPI/SQLAlchemy/etc.).
testpaths = ["tests", "controlplane/tests"]
