# AgentReplay ingest API — Fly.io deployment config.
# Two process groups, one image (see ../Dockerfile): `app` serves the FastAPI
# ingest API, `worker` runs the Celery classifier/assertion-spec consumer.
# Both must stay always-on — `auto_stop_machines = "off"` on `app` mirrors
# AgentBook's "must not be changed" note: a suspended `worker` machine stops
# draining the classification queue (CLAUDE.md §3.6).

app = "agentreplay-ingest"
primary_region = "syd"

# Build context must be the monorepo root (not this ingest/ dir) since the
# image also needs the root `agentreplay` SDK package — see Dockerfile.
# Deploy this with: `flyctl deploy --config ingest/fly.toml --dockerfile
# ingest/Dockerfile .` run from the repo root, not from ingest/.
[build]
  dockerfile = "Dockerfile"

[processes]
app = "uvicorn app.main:app --host 0.0.0.0 --port 8080"
worker = "celery -A app.celery_app worker --loglevel=info"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/healthz"

[[vm]]
memory = "256mb"
cpu_kind = "shared"
cpus = 1
processes = ["app"]

# 256mb OOM-killed the classifier task's fork-pool child (found live
# 2026-08-10: `agentreplay.classify_run` received, then kernel OOM kill at
# ~91MB child RSS on top of the Celery parent) — 512mb is the floor here.
[[vm]]
memory = "512mb"
cpu_kind = "shared"
cpus = 1
processes = ["worker"]
